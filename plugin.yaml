name: "helmgen"
version: "0.1.0"
usage: "Generate Helm charts using helmgen"
description: "A plugin to generate Helm charts using the helmgen tool"
command: "$HELM_PLUGIN_DIR/helmgen.sh"
platformHooks:
  install:
    - os: linux
      command: "pip install -r $HELM_PLUGIN_DIR/requirements.txt"
    - os: darwin
      command: "pip install -r $HELM_PLUGIN_DIR/requirements.txt"
    - os: windows
      command: "pip install -r $Env:HELM_PLUGIN_DIR\\requirements.txt"
